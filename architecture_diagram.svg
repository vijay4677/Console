<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network guard architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1117"/>
      <stop offset="1" stop-color="#111B24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1D2B38"/>
      <stop offset="1" stop-color="#16212D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#8BC4FF"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#4DD4AC"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF7F7F"/>
    </marker>
    <style>
      .title { fill: #E8EEF5; font: 700 34px Inter, Arial, sans-serif; letter-spacing: -0.02em; }
      .subtitle { fill: #A8B4C0; font: 500 16px Inter, Arial, sans-serif; }
      .section { fill: #E8EEF5; font: 700 20px Inter, Arial, sans-serif; }
      .label { fill: #E8EEF5; font: 700 18px Inter, Arial, sans-serif; }
      .text { fill: #A8B4C0; font: 500 14px Inter, Arial, sans-serif; }
      .tiny { fill: #A8B4C0; font: 500 12px Inter, Arial, sans-serif; }
      .box { fill: url(#panel); stroke: rgba(255,255,255,0.08); stroke-width: 1.2; filter: url(#shadow); }
      .boxAccent { fill: rgba(77,212,172,0.10); stroke: rgba(77,212,172,0.42); stroke-width: 1.4; filter: url(#shadow); }
      .boxSoft { fill: rgba(139,196,255,0.10); stroke: rgba(139,196,255,0.42); stroke-width: 1.4; filter: url(#shadow); }
      .boxWarn { fill: rgba(255,127,127,0.12); stroke: rgba(255,127,127,0.50); stroke-width: 1.4; filter: url(#shadow); }
      .line { stroke: rgba(139,196,255,0.70); stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineGreen { stroke: rgba(77,212,172,0.75); stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .lineRed { stroke: rgba(255,127,127,0.80); stroke-width: 3; fill: none; marker-end: url(#arrowRed); }
      .dash { stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <text x="80" y="78" class="title">Network Guard Architecture</text>
  <text x="80" y="110" class="subtitle">Automatic startup hook + Python-level interceptor for only localhost:8080</text>

  <!-- Left lane -->
  <text x="90" y="170" class="section">Startup path</text>
  <rect x="80" y="200" rx="18" ry="18" width="360" height="110" class="boxSoft"/>
  <text x="260" y="240" text-anchor="middle" class="label">Python interpreter</text>
  <text x="260" y="268" text-anchor="middle" class="text">Dataiku code env or local venv</text>
  <text x="260" y="292" text-anchor="middle" class="text">loads site-packages at startup</text>

  <rect x="80" y="350" rx="18" ry="18" width="360" height="110" class="boxSoft"/>
  <text x="260" y="390" text-anchor="middle" class="label">network_guard_bootstrap.pth</text>
  <text x="260" y="418" text-anchor="middle" class="text">contains: import network_guard.bootstrap</text>
  <text x="260" y="442" text-anchor="middle" class="text">executes automatically when Python starts</text>

  <rect x="80" y="500" rx="18" ry="18" width="360" height="130" class="boxAccent"/>
  <text x="260" y="540" text-anchor="middle" class="label">network_guard.bootstrap</text>
  <text x="260" y="568" text-anchor="middle" class="text">calls install_network_guard()</text>
  <text x="260" y="592" text-anchor="middle" class="text">keeps startup logic minimal</text>
  <text x="260" y="616" text-anchor="middle" class="text">no telemetry, no config</text>

  <path d="M260 310 L260 350" class="line"/>
  <path d="M260 460 L260 500" class="lineGreen"/>

  <!-- Middle lane -->
  <text x="520" y="170" class="section">Interceptor layer</text>
  <rect x="500" y="200" rx="18" ry="18" width="500" height="150" class="box"/>
  <text x="750" y="238" text-anchor="middle" class="label">network_guard.interceptor</text>
  <text x="750" y="266" text-anchor="middle" class="text">patches requests, httpx, urllib, and socket</text>
  <text x="750" y="290" text-anchor="middle" class="text">checks only one target: localhost:8080</text>
  <text x="750" y="314" text-anchor="middle" class="text">raises DirectNetworkBlockedError when target matches</text>
  <text x="750" y="338" text-anchor="middle" class="text">lets other hosts and ports pass through</text>

  <rect x="500" y="390" rx="18" ry="18" width="500" height="120" class="boxSoft"/>
  <text x="750" y="430" text-anchor="middle" class="label">Allowed rule</text>
  <text x="750" y="458" text-anchor="middle" class="text">if request destination is not localhost:8080</text>
  <text x="750" y="482" text-anchor="middle" class="text">proceed normally</text>

  <rect x="500" y="545" rx="18" ry="18" width="500" height="120" class="boxWarn"/>
  <text x="750" y="585" text-anchor="middle" class="label">Blocked rule</text>
  <text x="750" y="613" text-anchor="middle" class="text">if request destination is localhost:8080 or 127.0.0.1:8080</text>
  <text x="750" y="637" text-anchor="middle" class="text">raise DirectNetworkBlockedError</text>

  <path d="M750 350 L750 390" class="line"/>
  <path d="M750 510 L750 545" class="lineGreen"/>

  <!-- Right lane -->
  <text x="1085" y="170" class="section">Application flows</text>
  <rect x="1040" y="210" rx="18" ry="18" width="470" height="130" class="boxAccent"/>
  <text x="1275" y="248" text-anchor="middle" class="label">SDK path: mylib1.send_greet()</text>
  <text x="1275" y="276" text-anchor="middle" class="text">call stack contains mylib1</text>
  <text x="1275" y="300" text-anchor="middle" class="text">request is permitted</text>
  <text x="1275" y="324" text-anchor="middle" class="text">then reaches the API endpoint</text>

  <rect x="1040" y="395" rx="18" ry="18" width="470" height="130" class="boxWarn"/>
  <text x="1275" y="433" text-anchor="middle" class="label">Direct path: requests/httpx/urllib/socket</text>
  <text x="1275" y="461" text-anchor="middle" class="text">if destination is localhost:8080</text>
  <text x="1275" y="485" text-anchor="middle" class="text">the interceptor blocks the call</text>
  <text x="1275" y="509" text-anchor="middle" class="text">no outgoing request is made</text>

  <rect x="1040" y="585" rx="18" ry="18" width="470" height="120" class="boxSoft"/>
  <text x="1275" y="624" text-anchor="middle" class="label">Target service</text>
  <text x="1275" y="652" text-anchor="middle" class="text">FastAPI / Dataiku service on localhost:8080</text>
  <text x="1275" y="676" text-anchor="middle" class="text">only SDK-approved traffic should reach it</text>

  <path d="M1000 275 L1040 275" class="lineGreen"/>
  <path d="M1000 460 L1040 460" class="lineRed"/>
  <path d="M1275 525 L1275 585" class="line"/>

  <!-- Bottom summary -->
  <rect x="80" y="740" rx="20" ry="20" width="1430" height="170" class="box"/>
  <text x="110" y="782" class="section">How to explain it</text>
  <text x="110" y="818" class="text">1. Python starts and reads the `.pth` file.</text>
  <text x="110" y="846" class="text">2. The `.pth` file imports `network_guard.bootstrap` automatically.</text>
  <text x="110" y="874" class="text">3. Bootstrap installs the interceptor.</text>
  <text x="110" y="902" class="text">4. Any request to `localhost:8080` made outside `mylib1` is blocked.</text>

  <text x="790" y="818" class="text">Allowed examples: `mylib1.send_greet("Vijay")`, requests to other hosts/ports.</text>
  <text x="790" y="846" class="text">Blocked examples: direct `requests.post("http://localhost:8080/...")`.</text>
  <text x="790" y="874" class="text">This is a Python-process guard, not a machine-wide firewall.</text>
  <text x="790" y="902" class="text">It is intentionally minimal: no telemetry, no config, only the interceptor.</text>
</svg>
